services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dialectio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dialectio}
      POSTGRES_DB: ${POSTGRES_DB:-dialectio}
    ports:
      - "127.0.0.1:5432:5432"  # this machine only: the dev password is public
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dialectio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Visit statistics without cookies (https://umami.is): docker compose --profile analytics up -d
  umami:
    image: ghcr.io/umami-software/umami:latest
    profiles: [analytics]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dialectio}:${POSTGRES_PASSWORD:-dialectio}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-change-me}
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
