# Production: the whole site on one server behind Caddy (automatic HTTPS).
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# See docs/deploy.md.
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dialectio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dialectio}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dialectio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dialectio}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dialectio}
      CORS_ORIGINS: '["https://${DOMAIN:?set DOMAIN}"]'
      EDITOR_TOKEN: ${EDITOR_TOKEN:-}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env.prod}
    volumes:
      # TTS audio and visitors' recordings
      - ./data/media:/data/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: frontend
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
        NEXT_PUBLIC_UMAMI_SRC: ${UMAMI_SRC:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    restart: unless-stopped
    environment:
      # Server-side rendering talks to the API inside the Docker network.
      API_INTERNAL_URL: http://backend:8000
      # Legal notice (/imprint)
      IMPRINT_NAME: ${IMPRINT_NAME:-}
      IMPRINT_ADDRESS: ${IMPRINT_ADDRESS:-}
      IMPRINT_EMAIL: ${IMPRINT_EMAIL:-}
    depends_on:
      - backend

  umami:
    image: ghcr.io/umami-software/umami:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dialectio}:${POSTGRES_PASSWORD}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?set UMAMI_APP_SECRET}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
